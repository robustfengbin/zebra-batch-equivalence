name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The Zebra revision this harness pins to lives in Cargo.toml as a git
  # dependency (`rev = ...`, v6.3.0), so cargo fetches and pins it during the
  # build — no checkout step, and CI cannot drift from a local tree. The oracle
  # drives Zebra's verifiers through public APIs only; no source changes.

jobs:
  test:
    name: Unit + baseline agreement
    # Every job in these workflows pins its runner rather than using
    # ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19. A runner image
    # changing under a delivered repository turns CI red for reasons that have
    # nothing to do with the code, on the dates a reviewer is likeliest to look.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (clang for any FFI/bindgen in the closure)
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: dtolnay/rust-toolchain@master
        with:
          # Matches `rust-version` in Cargo.toml (MSRV unchanged by the v6.3.0 re-baseline).
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      # Unit tests (oracle classification) plus the baseline-agreement test:
      # real pre-NU6.2 Orchard proofs must satisfy batch == single with zero
      # spurious disagreements (grant AC2).
      - name: cargo test
        run: cargo test --all-targets --locked

  fuzz:
    name: Fuzz target build + smoke run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # grant AC1: the harness builds and runs in CI. `cargo fuzz build` builds
      # every [[bin]] in fuzz/Cargo.toml, so this step cannot fall behind the
      # crate — unlike the smoke-run list below, which did.
      - name: Build all fuzz targets
        run: cargo +nightly fuzz build

      # cargo-fuzz has no `--locked` flag and re-resolves patch versions of
      # transitive registry deps, so the fuzz job's resolution is left free; the
      # reproducible, lock-pinned run is the `test` job's `cargo test --locked`.
      # A broken resolution still fails here at build or smoke-run.

      # W7: feed every target real-proof seeds (sampled per era — accepted
      # seeds each drive real SNARK verification, so budgets stay bounded; the
      # full-corpus soundness sweep runs in `cargo test`). A FalseAccept /
      # fail-open / order-dependence panics, so a green smoke is a CI-level
      # soundness gate over real proofs, not just a parse check.
      #
      # Measured locally (2026-07-17): whole seeded-smoke block ~12 min; the
      # floor is the first unit paying the lazy VerifyingKey cold builds
      # (~75 s on the three targets that touch multiple era keys), so budgets
      # below are soft: libFuzzer finishes the in-flight unit before stopping.
      - name: Seed corpora from real proofs
        run: ./scripts/prep-fuzz-corpus.sh

      # `-timeout=25` is not a local choice: it is what OSS-Fuzz's and
      # ClusterFuzzLite's runner passes, and libFuzzer's own default is 1200.
      # Running the smoke without it left a 48x gap between the limit here and
      # the limit where these targets actually have to survive — which is how
      # three multi-second circuit-key cold starts sat inside the first unit of
      # every run, unnoticed here and reported as a `timeout-<hash>` crash
      # there, blaming an input that was fine. Matching the flag makes that
      # class of divergence fail in the cheap place.
      # 🔴 Every target, enumerated from fuzz/Cargo.toml rather than listed here.
      #
      # This step used to name seven targets by hand. The crate had nine:
      # tower_partition_equivalence and turnstile_order_independence were added
      # during M3 and never reached this list — and `.clusterfuzzlite/build.sh`
      # carried the same seven, so neither the smoke run nor the published
      # artefacts covered them, while the build step above compiled all nine and
      # reported success. Nothing compared the two counts.
      #
      # tests/fuzz_input_reach.rs now checks that Cargo.toml and fuzz_targets/
      # agree; enumerating here is what keeps this file from being the third
      # place that can disagree with them.
      - name: Smoke run every fuzz target (seeded, bounded, must not crash)
        run: |
          targets=$(awk '/^\[\[bin\]\]/{b=1;next} b && /^name = /{gsub(/["]/,"",$3); print $3; b=0}' fuzz/Cargo.toml)
          test -n "$targets" || { echo "no [[bin]] targets in fuzz/Cargo.toml" >&2; exit 1; }
          echo "smoke-running $(echo "$targets" | wc -l) target(s): $(echo $targets)"
          for t in $targets; do
            # 90s for the targets that touch more than one era's verifying key:
            # the lazy cold build is ~75s and libFuzzer finishes the in-flight
            # unit before stopping, so a 60s budget there measures the key build
            # and almost nothing else.
            case "$t" in
              orchard_era_routing|orchard_single_deep|tower_partition_equivalence) budget=90 ;;
              *) budget=60 ;;
            esac
            echo "::group::$t (${budget}s)"
            cargo +nightly fuzz run "$t" -- \
              -runs=200000 -max_total_time="$budget" -timeout=25 -print_final_stats=1
            echo "::endgroup::"
          done
